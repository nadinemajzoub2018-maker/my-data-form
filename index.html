<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Multi-Upload Form with Folders</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; margin: 0; }
        form { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; display: flex; flex-direction: column; }
        h3 { margin-top: 0; color: #333; text-align: center; margin-bottom: 20px; }
        label { font-size: 13px; color: #333; margin-bottom: 5px; font-weight: bold; display: block; }
        input { margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .file-box { margin-bottom: 15px; padding: 5px 0; }
        button { background: #24292e; color: white; border: none; padding: 12px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { background: #333; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <form id="leadForm">
        <h3>Submit Details & Files</h3>
        
        <input type="text" id="username" placeholder="Your Name" required>
        <input type="email" id="useremail" placeholder="Your Email" required>
        
        <label for="userfiles">Choose Files to Attach:</label>
        <input type="file" id="userfiles" class="file-box" accept=".pdf, .jpg, .jpeg, .png" multiple required>
        
        <button type="submit" id="submitBtn">Submit Data</button>
    </form>

    <script>
        // === PASTE YOUR CREDENTIALS BELOW ===
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_0DWJebA2Vn3HIyGf7iSxgg_uZAfbfTR";
        // ===================================

        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            const name = document.getElementById('username').value;
            const email = document.getElementById('useremail').value;
            const fileInput = document.getElementById('userfiles');
            const filesList = fileInput.files;

            const cleanUrl = SUPABASE_URL.replace(/\/$/, ""); 
            
            // Clean up the email to make it a perfect folder name
            const folderName = email.toLowerCase().replace(/[^a-z0-9]/g, "_");
            
            alert("Folder Connection: Creating folder for " + folderName);

            try {
                const publicUrls = [];

                // 1. Upload files directly using native fetch streams into a dedicated subfolder path
                for (let i = 0; i < filesList.length; i++) {
                    const file = filesList[i];
                    const safeFileName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
                    const uniqueFileName = Date.now() + "_" + safeFileName;
                    
                    // FIX: Placing folderName + "/" right here instructs Supabase to build a virtual subfolder dynamically!
                    const storageEndpoint = cleanUrl + "/storage/v1/object/user_files/" + folderName + "/" + uniqueFileName;

                    const fileBlob = new Blob([file], { type: file.type });

                    const storageResponse = await fetch(storageEndpoint, {
                        method: "POST",
                        headers: {
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                            "Content-Type": file.type,
                            "x-upsert": "true"
                        },
                        body: fileBlob
                    });

                    if (!storageResponse.ok) {
                        throw new Error("Folder generation upload failed.");
                    }

                    // Save the public link reference that includes the new folder path structure
                    publicUrls.push(cleanUrl + "/storage/v1/object/public/user_files/" + folderName + "/" + uniqueFileName);
                }

                alert("Files saved inside folder! Finalizing database row...");

                // 2. Save text values inside an array matching your PostgREST schema layout
                const tableEndpoint = cleanUrl + "/rest/v1/user_leads";
                const databasePayload = [{
                    name: name,
                    email: email,
                    file_url: publicUrls.join(" | ")
                }];

                const tableResponse = await fetch(tableEndpoint, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify(databasePayload)
                });

                if (tableResponse.ok) {
                    alert("🎉 SUCCESS! Everything has been safely saved in subfolders!");
                    document.getElementById('leadForm').reset();
                } else {
                    const responseText = await tableResponse.text();
                    alert("Database write error: " + responseText);
                }

            } catch (err) {
                alert("Stopped: " + err.message);
            } finally {
                btn.innerText = "Submit Data";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
