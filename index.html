<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Intake Form</title>
    <!-- Load the official Supabase bundle globally -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f4f9; margin: 0; padding: 20px 0; }
        form { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; display: flex; flex-direction: column; }
        h3 { margin-top: 0; color: #333; text-align: center; margin-bottom: 20px; }
        label { font-size: 13px; color: #333; margin-bottom: 5px; font-weight: bold; display: block; }
        input { margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: calc(100% - 22px); }
        .file-box { margin-bottom: 15px; padding: 5px 0; }
        button { background: #24292e; color: white; border: none; padding: 12px; cursor: pointer; font-weight: bold; border-radius: 4px; margin-top: 10px; }
        button:hover { background: #333; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <form id="leadForm">
        <h3>Application Intake Form</h3>
        
        <!-- The name attributes here map perfectly to your Supabase table columns -->
        <input type="text" name="first_name" placeholder="First Name" required>
        <input type="text" name="father_name" placeholder="Father's Name" required>
        <input type="text" name="last_name" placeholder="Last Name" required>
        
        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" required>
        
        <input type="text" name="pob" placeholder="Place of Birth" required>
        <input type="text" name="nationality" placeholder="Nationality" required>
        <input type="email" name="email" id="useremail" placeholder="Your Email Address" required>
        <input type="tel" name="mobile" placeholder="Mobile Number" required>
        <input type="text" name="address" placeholder="Current Residential Address" required>
        <input type="text" name="major" placeholder="Applying Major" required>
        
        <label for="userfiles">Choose Files to Attach:</label>
        <input type="file" id="userfiles" class="file-box" accept=".pdf, .jpg, .jpeg, .png" multiple required>
        
        <button type="submit" id="submitBtn">Submit Application</button>
    </form>

    <script>
        // === PASTE YOUR CREDENTIALS BELOW ===
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_0DWJebA2Vn3HIyGf7iSxgg_uZAfbfTR";
        // ===================================

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            const email = document.getElementById('useremail').value;
            const fileInput = document.getElementById('userfiles');
            const filesList = fileInput.files;

            const folderName = email.toLowerCase().replace(/[^a-z0-9]/g, "_");
            alert("Upload Initiated: Transmitting application bundle...");

            try {
                const publicUrls = [];

                // 1. Upload files securely via PUT network operations into user subfolders
                for (let i = 0; i < filesList.length; i++) {
                    const file = filesList[i];
                    const safeFileName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
                    const uniqueFileName = Date.now() + "_" + safeFileName;

                    const { error: storageError } = await supabaseClient
                        .storage
                        .from('user_files')
                        .upload(folderName + "/" + uniqueFileName, file, {
                            cacheControl: '3600',
                            upsert: true
                        });

                    if (storageError) throw new Error("Storage Upload Error: " + storageError.message);

                    const { data: urlData } = supabaseClient
                        .storage
                        .from('user_files')
                        .getPublicUrl(folderName + "/" + uniqueFileName);

                    publicUrls.push(urlData.publicUrl);
                }

                alert("Files saved into folders! Syncing text fields to table grid...");

                // FIX: Collect form entries directly from input fields automatically.
                // This completely bypasses line numbers and individual field code typos!
                const formFields = new FormData(document.getElementById('leadForm'));
                const rowPayload = Object.fromEntries(formFields.entries());
                
                // Append the combined file links string to the data package
                rowPayload.file_url = publicUrls.join(" | ");

                const { error: tableError } = await supabaseClient
                    .from('user_leads')
                    .insert([rowPayload]);

                if (tableError) throw new Error("Database Table Error: " + tableError.message);

                alert("🎉 SUCCESS! Your application details have been completely saved!");
                document.getElementById('leadForm').reset();

            } catch (err) {
                alert("Stopped: " + err.message);
            } finally {
                btn.innerText = "Submit Application";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
