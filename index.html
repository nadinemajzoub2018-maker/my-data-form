<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Intake Form</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f4f9; margin: 0; padding: 20px 0; }
        form { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; display: flex; flex-direction: column; }
        h3 { margin-top: 0; color: #333; text-align: center; margin-bottom: 20px; }
        label { font-size: 13px; color: #333; margin-bottom: 5px; font-weight: bold; display: block; }
        input { margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: calc(100% - 22px); }
        .file-box { margin-bottom: 15px; padding: 5px 0; }
        button { background: #24292e; color: white; border: none; padding: 12px; cursor: pointer; font-weight: bold; border-radius: 4px; margin-top: 10px; }
        button:hover { background: #333; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <form id="leadForm">
        <h3>Application Intake Form</h3>
        
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="fatherName" placeholder="Father's Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>
        
        <input type="text" id="pob" placeholder="Place of Birth" required>
        <input type="text" id="nationality" placeholder="Nationality" required>
        <input type="email" id="useremail" placeholder="Your Email Address" required>
        <input type="tel" id="mobile" placeholder="Mobile Number" required>
        <input type="text" id="address" placeholder="Current Residential Address" required>
        
        <input type="text" id="major" placeholder="Applying Major" required>
        
        <label for="userfiles">Choose Files to Attach:</label>
        <input type="file" id="userfiles" class="file-box" accept=".pdf, .jpg, .jpeg, .png" multiple required>
        
        <button type="button" id="submitBtn">Submit Application</button>
    </form>

    <script>
        // === PASTE YOUR CREDENTIALS BELOW ===
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_0DWJebA2Vn3HIyGf7iSxgg_uZAfbfTR";
        // ===================================

        document.getElementById('submitBtn').addEventListener('click', function() {
            var btn = document.getElementById('submitBtn');
            var email = document.getElementById('useremail').value;
            var fileInput = document.getElementById('userfiles');
            var filesList = fileInput.files;

            if (!document.getElementById('leadForm').checkValidity()) {
                alert("Please fill out all required fields first.");
                return;
            }

            btn.innerText = "Processing...";
            btn.disabled = true;

            var cleanUrl = SUPABASE_URL.replace(/\/$/, "");
            var folderName = email.toLowerCase().replace(/[^a-z0-9]/g, "_");

            alert("Diagnostics initiated. Uploading files into path: " + folderName);

            var publicUrls = [];
            var uploadPromises = Array.from(filesList).map(function(file) {
                var safeFileName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
                var uniqueFileName = Date.now() + "_" + safeFileName;
                var storageEndpoint = cleanUrl + "/storage/v1/object/user_files/" + folderName + "/" + uniqueFileName;

                return fetch(storageEndpoint, {
                    method: "PUT",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                        "Content-Type": file.type
                    },
                    body: file
                })
                .then(function(res) {
                    if (!res.ok) throw new Error("Upload aborted.");
                    return cleanUrl + "/storage/v1/object/public/user_files/" + folderName + "/" + uniqueFileName;
                });
            });

            Promise.all(uploadPromises)
            .then(function(urls) {
                publicUrls = urls;
                alert("Files uploaded! Pushing rows into data columns...");

                var databasePayload = [{
                    first_name: document.getElementById('firstName').value,
                    father_name: document.getElementById('fatherName').value,
                    last_name: document.getElementById('lastName').value,
                    dob: document.getElementById('dob').value,
                    pob: document.getElementById('pob').value,
                    nationality: document.getElementById('nationality').value,
                    email: email,
                    mobile: document.getElementById('mobile').value,
                    address: document.getElementById('address').value,
                    major: document.getElementById('major').value,
                    file_url: publicUrls.join(" | ")
                }];

                return fetch(cleanUrl + "/rest/v1/user_leads", {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify(databasePayload)
                });
            })
            .then(function(tableRes) {
                if (tableRes.ok) {
                    alert("🎉 SUCCESS! Application completely saved!");
                    document.getElementById('leadForm').reset();
                } else {
                    return tableRes.text().then(function(txt) {
                        alert("Database configuration mismatch: " + txt);
                    });
                }
            })
            .catch(function(err) {
                alert("Submission Message Error: " + err.message);
            })
            .finally(function() {
                btn.innerText = "Submit Application";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
